
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My best friend forever <3^^> </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #020312;
    color: white;
    font-family: "Segoe UI", Arial, sans-serif;
}

#universe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.nebula {
    position: fixed;
    inset: -30%;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 20% 40%,
            rgba(69, 38, 180, .30), transparent 35%),
        radial-gradient(ellipse at 80% 30%,
            rgba(0, 150, 255, .23), transparent 35%),
        radial-gradient(ellipse at 50% 85%,
            rgba(190, 45, 190, .20), transparent 40%);
    filter: blur(35px);
    animation: nebulaMove 16s ease-in-out infinite alternate;
}

@keyframes nebulaMove {
    from { transform: translate(-2%, -1%) scale(1); }
    to { transform: translate(2%, 2%) scale(1.12); }
}

.message {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
}

.small-title {
    color: #a9dcff;
    font-size: clamp(11px, 2vw, 18px);
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 28px;
    opacity: 0;
    animation: appear 1.5s ease forwards .5s;
    text-shadow: 0 0 18px #42baff;
}

.line {
    opacity: 0;
    transform: translateY(25px) scale(.95);
    animation: lineAppear 1.4s ease forwards;
    font-weight: 800;
    line-height: 1.4;
}

.line:nth-child(2) {
    font-size: clamp(32px, 7vw, 75px);
    color: #fff;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #83cfff,
        0 0 55px #4285ff;
    animation-delay: 1.5s;
}

.line:nth-child(3) {
    font-size: clamp(55px, 12vw, 125px);
    background: linear-gradient(
        90deg, #8be9ff, #fff, #f5baff, #8be9ff
    );
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(123, 172, 255, .8));
    animation:
        lineAppear 1.5s ease forwards 2.7s,
        gradientMove 5s linear infinite 4.2s;
}

.line:nth-child(4) {
    font-size: clamp(27px, 6vw, 65px);
    color: #ffe8a3;
    text-shadow:
        0 0 12px #ffd66b,
        0 0 35px #ff9f43,
        0 0 70px #ff6cba;
    margin-top: 8px;
    animation-delay: 4s;
}

.subtitle {
    font-size: clamp(11px, 2vw, 18px);
    color: #d6d8ff;
    letter-spacing: 2px;
    margin-top: 30px;
    opacity: 0;
    animation: appear 1.5s ease forwards 5.5s;
    text-shadow: 0 0 15px #8e9fff;
}

@keyframes appear {
    to { opacity: 1; }
}

@keyframes lineAppear {
    0% {
        opacity: 0;
        transform: translateY(25px) scale(.95);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes gradientMove {
    to { background-position: 300% center; }
}

.heart {
    position: fixed;
    bottom: -40px;
    left: 0;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    color: #ff8acb;
    text-shadow:
        0 0 8px #ff65bd,
        0 0 18px #ff2fa5,
        0 0 30px #b64dff;
    animation: heartFloat linear forwards;
    will-change: transform, opacity;
}

@keyframes heartFloat {
    0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(.6);
        opacity: 0;
    }
    12% { opacity: .9; }
    50% {
        transform: translate3d(35px, -55vh, 0)
                   rotate(18deg) scale(1);
        opacity: .8;
    }
    85% { opacity: .55; }
    100% {
        transform: translate3d(-25px, -115vh, 0)
                   rotate(-20deg) scale(.7);
        opacity: 0;
    }
}

.hint {
    position: fixed;
    z-index: 4;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: rgba(210, 225, 255, .55);
    font-size: 10px;
    letter-spacing: 3px;
    pointer-events: none;
}

@media (max-width: 480px) {
    .small-title { letter-spacing: 3px; }
    .subtitle { letter-spacing: 1px; }
}
</style>
</head>

<body>

<canvas id="universe"></canvas>
<div class="nebula"></div>

<main class="message"> 

    <div class="line">Chúc mừng</div>
    <div class="line">Ngày phụ nữ Việt Nam 20/10</div>
    <div class="line">Chúc cho BFF luôn vui vẻ nekkkkkk 💖</div>

    <div class="subtitle">   
        Chúc cho my BFF sẽ luôn vui tươi, học thật tốt và sẽ đậu được trường đại học mơ ước nè 
    </div>    

    <div class = "hint"> Love you forever </div>
</main>

<script>
const canvas = document.getElementById("universe");
const ctx = canvas.getContext("2d");

let width, height;
let stars = [];

const STAR_COUNT = 12000;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createStars() {
    stars = [];

    for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.35 + .15,
            alpha: Math.random() * .8 + .2,
            speed: Math.random() * .018 + .003,
            phase: Math.random() * Math.PI * 2,
            color: Math.random()
        });
    }
}

function draw(time) {
    ctx.clearRect(0, 0, width, height);

    for (const s of stars) {
        const twinkle = .35 + .65 *
            ((Math.sin(time * s.speed + s.phase) + 1) / 2);

        const alpha = s.alpha * twinkle;

        let color;

        if (s.color < .10) {
            color = "190, 155, 255";
        } else if (s.color < .25) {
            color = "130, 205, 255";
        } else {
            color = "255, 255, 255";
        }

        ctx.beginPath();
        ctx.fillStyle = `rgba(${color}, ${alpha})`;
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();

        // Những ngôi sao sáng có tia lấp lánh
        if (s.radius > 1.15 && alpha > .7) {
            ctx.strokeStyle = `rgba(${color}, ${alpha * .45})`;
            ctx.lineWidth = .6;

            ctx.beginPath();
            ctx.moveTo(s.x - 3, s.y);
            ctx.lineTo(s.x + 3, s.y);
            ctx.moveTo(s.x, s.y - 3);
            ctx.lineTo(s.x, s.y + 3);
            ctx.stroke();
        }
    }

    requestAnimationFrame(draw);
}

function initUniverse() {
    resize();
    createStars();
    requestAnimationFrame(draw);
}

window.addEventListener("resize", () => {
    resize();
    createStars();
});

initUniverse();


const heartSymbols = ["💗", "💖", "💕", "♡", "♥", "💜"];

function createHeart() {
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent =
        heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (10 + Math.random() * 17) + "px";
    heart.style.animationDuration = (7 + Math.random() * 9) + "s";

    document.body.appendChild(heart);

    heart.addEventListener("animationend", () => {
        heart.remove();
    }, { once: true });
}


setInterval(createHeart, 350);
for (let i = 0; i < 18; i++) {
    setTimeout(createHeart, i * 180);
}
</script>

</body>
</html>
